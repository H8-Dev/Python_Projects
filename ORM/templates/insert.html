{% extends 'base.html' %}
{% block titulo %}
    <title>Novo Pedido</title>
{% endblock %}


{% block conteudo%}
<h2>Fazer Novo Pedido</h2>
<form action="/pedidos/insert" method="POST">
    <label>Nome: <input type="text" name="nome" required> </label><br>
    <label>Sabor: <input type="text" name="sabor" required> </label><br>
    <label>Tamanho: 
        <input type="radio" id="broto" name="tamanho" required> <label for="broto">Broto = 20cm</label>
        <input type="radio" id="pequeno" name="tamanho" required> <label for="pequeno">Pequeno = 25cm</label>
        <input type="radio" id="medio" name="tamanho" required> <label for="medio">Medio = 30cm</label>
        <input type="radio" id="grande" name="tamanho" required> <label for="grande">Grande = 35cm</label>
        <input type="radio" id="gigante" name="tamanho" required> <label for="gigante">Gigante = 45cm</label>
    </label><br>
    <label>Preço: <input type="number" min="0.00" max="45.00" step="0.01" name="preco" required></label><br>
    <label>Entrega: 
        <input type="radio" id="nao" name="entrega" checked> <label for="nao">Não</label>
        <input type="radio" id="sim" name="entrega"> <label for="sim">Sim</label>
     </label><br>
    <button type="submit">Pedir</button>
</form>

{% endblock %}
